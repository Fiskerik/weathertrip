workflows:
  ios-testflight:
    name: Weathertrip iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      groups:
        - code-signing
      vars:
        APP_VERSION: "0.1.0"
        IOS_BUNDLE_IDENTIFIER: "com.eaconsulting.weathertrip"
        EXPO_NO_TELEMETRY: "1"
    integrations:
      app_store_connect: FamilyCalendarIOS
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Set automatic build number
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$IOS_BUNDLE_IDENTIFIER" --all-versions 2>/dev/null || true)
          case "$LATEST_BUILD_NUMBER" in
            ''|*[!0-9]*) LATEST_BUILD_NUMBER=0 ;;
          esac

          CODEMAGIC_BUILD_NUMBER="${PROJECT_BUILD_NUMBER:-${BUILD_NUMBER:-0}}"
          case "$CODEMAGIC_BUILD_NUMBER" in
            ''|*[!0-9]*) CODEMAGIC_BUILD_NUMBER=0 ;;
          esac

          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          if [ "$CODEMAGIC_BUILD_NUMBER" -gt "$NEW_BUILD_NUMBER" ]; then
            NEW_BUILD_NUMBER="$CODEMAGIC_BUILD_NUMBER"
          fi

          echo "APP_BUILD_NUMBER=$NEW_BUILD_NUMBER" >> "$CM_ENV"
          echo "Latest TestFlight build: $LATEST_BUILD_NUMBER"
          echo "Codemagic build number: $CODEMAGIC_BUILD_NUMBER"
          echo "Using iOS build number: $NEW_BUILD_NUMBER"
      - name: Build shared package
        script: npm --workspace @weathertrip/shared run build
      - name: Typecheck mobile app
        script: npm --workspace @weathertrip/mobile run typecheck
      - name: Prebuild iOS project
        script: |
          cd apps/mobile
          npx expo prebuild --platform ios --clean --non-interactive
      - name: Set App Store encryption answer
        script: |
          PLIST_PATH="apps/mobile/ios/Weathertrip/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST_PATH" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST_PATH"
          echo "Set ITSAppUsesNonExemptEncryption=false"
      - name: Confirm iOS build number
        script: |
          cd apps/mobile/ios
          if [ -n "$APP_VERSION" ]; then
            xcrun agvtool new-marketing-version "$APP_VERSION"
          fi
          xcrun agvtool new-version -all "$APP_BUILD_NUMBER"
          echo "Set Xcode build number to $APP_BUILD_NUMBER"
      - name: Configure iOS code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$IOS_BUNDLE_IDENTIFIER" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project apps/mobile/ios/Weathertrip.xcodeproj
      - name: Build IPA
        script: |
          cd apps/mobile
          xcode-project build-ipa \
            --workspace ios/Weathertrip.xcworkspace \
            --scheme Weathertrip
    artifacts:
      - apps/mobile/build/ios/ipa/*.ipa
      - apps/mobile/ios/build/**/*.xcarchive
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
