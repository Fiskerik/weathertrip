workflows:
  ios-testflight:
    name: Weathertrip iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: com.eaconsulting.weathertrip
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Typecheck shared code
        script: npm --workspace @weathertrip/shared run typecheck
      - name: Typecheck mobile app
        script: npm --workspace @weathertrip/mobile run typecheck
      - name: Prebuild iOS project
        script: npm --workspace @weathertrip/mobile run prebuild:ios
      - name: Install CocoaPods
        script: cd apps/mobile/ios && pod install
      - name: Apply code signing profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace apps/mobile/ios/Weathertrip.xcworkspace \
            --scheme Weathertrip
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
